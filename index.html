<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f1f1;
    --card:#f4f4f4;
    --border:#d4d4d4;
    --muted:#7a7a7a;
    --muted-58:rgba(122,122,122,0.58);
    --black:#000;
    --white:#fff;
    --chilled:rgba(172,234,238,0.55);
    --fresh:rgba(172,234,238,0.55);
    --ambient:rgba(172,238,176,0.55);
    --radius-lg:20px;
    --radius-md:10px;
    --sidebar-w:334px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Roboto','Google Sans Flex','Google Sans',-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:#000;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    animation:bodyFade .4s ease;
  }
  @keyframes bodyFade{from{opacity:0;}to{opacity:1;}}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  .hidden{display:none!important;}

  /* ---------- Motion system ---------- */
  @keyframes screenIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes popIn{
    0%{transform:scale(.55); opacity:0;}
    65%{transform:scale(1.18);}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes rowIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes radioBounce{
    0%{transform:scale(.76);}
    50%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  @keyframes innerDotPop{
    0%{transform:scale(0); opacity:0;}
    60%{transform:scale(1.35); opacity:1;}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes chipPopIn{
    0%{transform:scale(.65) translateY(4px); opacity:0;}
    70%{transform:scale(1.08);}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes chipSlotPulse{
    0%, 100%{border-color:#ccc; background:#fafafa;}
    50%{border-color:#999; background:#f2f2f7;}
  }
  @keyframes railArrowNudge{
    from{transform:translateX(0);}
    to{transform:translateX(-4px);}
  }
  @keyframes toastSpringIn{
    0%{opacity:0; transform:translateX(-50%) translateY(26px) scale(.92);}
    65%{transform:translateX(-50%) translateY(-3px) scale(1.03);}
    100%{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}
  }
  @keyframes countBump{
    0%{transform:scale(1);}
    35%{transform:scale(1.22); color:#000; font-weight:700;}
    100%{transform:scale(1);}
  }
  @keyframes progressShimmer{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(100%);}
  }
  @keyframes wpRippleWave{
    0%{transform:translate(-50%, -50%) scale(0); opacity:0.4;}
    100%{transform:translate(-50%, -50%) scale(3); opacity:0;}
  }

  /* Universal Click Ripple */
  .wp-ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    transform:translate(-50%, -50%) scale(0);
    animation:wpRippleWave .52s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    z-index:99;
  }

  #app > *{animation:screenIn .38s cubic-bezier(.22,.85,.32,1) both;}
  button,.icon-btn,.back-btn,.d-select,.pill,.check-box,.signin-btn,.mark-btn,
  .d-row,.t-row,.batch-row,.item-row,.p-item-row,.stop-card,.order-chip,
  .d-nav-item,.field,#roleBar button,.d-summary,.load-head,.forgot,a,
  .staging-btn-stage,.staging-btn-deffer,.trip-save-btn,.trip-continue-btn,
  .trip-confirm-btn,.trip-mini-pill,.cluster-back-arrow,.staging-assign-rail,
  .staging-order-card,.trip-order-card,.trip-box-card,.load-row-card,.cluster-row,.v-row{
    transition:background-color .2s ease, color .2s ease, border-color .2s ease,
      transform .16s cubic-bezier(.34,1.2,.4,1), box-shadow .2s ease, opacity .2s ease;
  }
  button{cursor:pointer;}
  ::selection{background:#000;color:#fff;}

  /* Ripple container positioning */
  button,.signin-btn,.sm-signin-btn,.store-create-btn,.d-assign-btn,.load-dispatch-btn,
  .staging-btn-stage,.staging-btn-deffer,.trip-save-btn,.trip-continue-btn,.trip-confirm-btn,
  .trip-order-chip,.trip-mini-pill,.trip-add-order-box,.staging-assign-rail,
  .staging-order-card,.trip-order-card,.cluster-row,.load-row-card,.d-row,.v-row,.t-row,
  .batch-row,.stop-card{
    position:relative;
    overflow:hidden;
  }

  /* Universal tactile click press physics */
  button:active, .signin-btn:active, .sm-signin-btn:active, .store-create-btn:active,
  .d-assign-btn:active, .load-dispatch-btn:active, .staging-btn-stage:active,
  .staging-btn-deffer:active, .trip-save-btn:active, .trip-continue-btn:active,
  .trip-confirm-btn:active{
    transform:translateY(1.5px) scale(.96)!important;
  }
  .staging-order-card:active, .trip-order-card:active, .load-row-card:active,
  .cluster-row:active, .v-row:active, .d-row:active{
    transform:scale(.992) translateY(1px);
  }
  .trip-mini-pill:active, .pill:active, .cluster-pill:active{
    transform:scale(.92)!important;
  }
  .cluster-back-arrow:active, .back-btn:active, .icon-btn:active{
    transform:scale(.86)!important;
  }

  /* Staggered entrance cascades */
  .staging-order-card:nth-child(1), .trip-order-card:nth-child(1), .cluster-row:nth-child(1), .load-row-card:nth-child(1), .d-row:nth-child(1), .v-row:nth-child(1){ animation-delay:.03s; }
  .staging-order-card:nth-child(2), .trip-order-card:nth-child(2), .cluster-row:nth-child(2), .load-row-card:nth-child(2), .d-row:nth-child(2), .v-row:nth-child(2){ animation-delay:.07s; }
  .staging-order-card:nth-child(3), .trip-order-card:nth-child(3), .cluster-row:nth-child(3), .load-row-card:nth-child(3), .d-row:nth-child(3), .v-row:nth-child(3){ animation-delay:.11s; }
  .staging-order-card:nth-child(4), .trip-order-card:nth-child(4), .cluster-row:nth-child(4), .load-row-card:nth-child(4), .d-row:nth-child(4), .v-row:nth-child(4){ animation-delay:.15s; }
  .staging-order-card:nth-child(5), .trip-order-card:nth-child(5), .cluster-row:nth-child(5), .load-row-card:nth-child(5), .d-row:nth-child(5), .v-row:nth-child(5){ animation-delay:.19s; }
  .staging-order-card:nth-child(6), .trip-order-card:nth-child(6), .cluster-row:nth-child(6), .load-row-card:nth-child(6), .d-row:nth-child(6), .v-row:nth-child(6){ animation-delay:.23s; }

  /* ---------- Top role switcher ---------- */
  #roleBar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    background:#000;color:#fff;font-size:12px;padding:6px 14px;
    padding-top:calc(6px + env(safe-area-inset-top,0px));
    letter-spacing:.4px;box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #roleBar .rb-left{display:flex;gap:14px;align-items:center;}
  #roleBar button{
    background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;
  }
  #roleBar button:hover{border-color:#fff;transform:translateY(-1px);}
  #roleBar button:active{transform:translateY(0) scale(.93);}
  #roleBar button.active{background:#fff;color:#000;border-color:#fff;font-weight:700;}
  #roleBar button.active:hover{transform:none;}
  #roleBar .rb-logout{background:transparent;border:none;color:#fff;text-decoration:underline;cursor:pointer;font-size:11px;}
  #roleBar .rb-logout:hover{opacity:.75;}
  #roleBar .rb-logout:active{opacity:.5;}
  #app{padding-top:34px;}

  /* ---------- Shared bits ---------- */
  .wp-logo{font-weight:900;letter-spacing:.2px;}
  .wp-role{font-weight:500;color:#000;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:20px;
    font-size:12px;font-weight:500;padding:3px 14px;white-space:nowrap;
  }
  .pill.Chilled{background:#cbf3f5;color:#000;}
  .pill.Fresh{background:#cbf3f5;color:#000;}
  .pill.Ambient{background:#daf5db;color:#000;}
  .pill.Fragile{background:#f0d9a8;color:#000;}
  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:#000;background:none;border:none;border-radius:50%;
  }
  .icon-btn:hover{background:rgba(0,0,0,0.06);transform:scale(1.1);}
  .icon-btn:active{transform:scale(.9);}
  .back-btn{
    width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:none;border:none;color:#000;font-size:22px;border-radius:50%;
  }
  .back-btn:hover{background:rgba(0,0,0,0.06);}
  .back-btn:hover svg path{transform:translateX(-1px);}
  .back-btn:active{transform:scale(.88);}

  /* ================= LOGIN SCREENS ================= */
  .login-wrap{min-height:calc(100vh - 34px);display:flex;flex-direction:column;background:#fff;}
  .login-topbar{display:flex;align-items:center;gap:10px;padding:28px 34px;font-size:20px;}
  .login-card-area{flex:1;display:flex;align-items:center;justify-content:center;}
  .login-card{width:100%;max-width:469px;padding:0 16px;text-align:left;}
  .login-card h1{font-size:40px;font-weight:500;margin:0 0 12px;text-align:center;}
  .login-card p.sub{color:var(--muted);font-size:20px;margin:0 0 40px;text-align:center;font-weight:500;}
  .field{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 24px;margin-bottom:16px;
  }
  .field:hover{border-color:#b7b7b7;}
  .field label{display:block;color:var(--muted-58);font-size:16px;font-weight:500;margin-bottom:2px;}
  .field .val{font-size:16px;font-weight:500;color:#000;}
  .field .dots{font-size:22px;letter-spacing:2px;color:#000;}
  .forgot{display:block;text-align:right;color:var(--muted-58);font-size:16px;font-weight:500;margin:8px 0 24px;cursor:pointer;}
  .forgot:hover{color:#000;}
  .signin-btn{
    width:100%;background:#000;color:#f4f4f4;border:1px solid #000;border-radius:50px;
    padding:22px;font-size:20px;font-weight:500;cursor:pointer;text-align:center;
  }
  .signin-btn:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.22);}
  .signin-btn:active{transform:translateY(0) scale(.98);box-shadow:none;}
  .signup-line{text-align:center;margin-top:32px;color:var(--muted-58);font-size:18px;font-weight:500;}
  .signup-line b{color:rgba(0,0,0,.5);font-weight:700;cursor:pointer;}
  .signup-line b:hover{color:#000;}

  /* ============ DISPATCH (Desktop) ============ */
  .dispatch-shell{
    display:none;background:var(--bg);
    min-height:calc(100vh - 34px);
    height:calc(100vh - 34px);
    overflow:hidden;
  }
  .dispatch-shell.active{display:flex;flex-direction:column;}
  .d-topbar{
    height:56px;flex:0 0 56px;background:var(--bg);z-index:10;
    display:flex;align-items:center;justify-content:space-between;padding:0 28px;
    box-sizing:border-box;
  }
  .d-topbar .brand{font-size:17px;letter-spacing:.2px;}
  .d-topbar .brand .wp-logo{font-weight:900;}
  .d-topbar .brand .wp-role{font-weight:500;}
  .d-topbar .actions{display:flex;gap:14px;align-items:center;}
  .d-topbar .actions .icon-btn{width:28px;height:28px;}
  .d-body{
    flex:1 1 auto;
    min-height:0;
    display:flex;gap:18px;width:100%;
    padding:6px 24px 20px;
    box-sizing:border-box;
    align-items:stretch;
    overflow:hidden;
  }
  .d-sidebar{
    width:240px;flex:0 0 240px;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:20px 22px;
    height:100%;overflow-y:auto;
    display:flex;flex-direction:column;
    box-sizing:border-box;
  }
  .panel-toggle-btn{
    width:24px;height:24px;margin-bottom:18px;margin-left:-2px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;color:#555;
  }
  .panel-toggle-btn:hover{color:#000;transform:scale(1.05);}
  .d-sidebar .group-label{
    color:#888;font-size:11px;font-weight:600;padding:0;margin:16px 0 8px;letter-spacing:.5px;
  }
  .d-sidebar .group-label:first-of-type{margin-top:0;}
  .d-nav-item{
    display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;
    font-size:14px;font-weight:500;color:#555;
    border:none;background:transparent;border-radius:6px;
    transition:color .18s ease, transform .16s ease;
  }
  .d-nav-item svg{flex:0 0 18px;color:#666;transition:color .18s ease;}
  .d-nav-item.active{font-weight:700;color:#000;}
  .d-nav-item.active svg{color:#000;}
  .d-nav-item:hover{color:#000;transform:translateX(2px);}
  .d-nav-item:hover svg{color:#000;}
  .d-nav-item:active{transform:scale(.98);}
  
  .d-main{
    flex:1;min-width:0;
    height:100%;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .d-header-locked{
    flex:0 0 auto;
    background:var(--bg);
    position:sticky;top:0;z-index:4;
    padding-bottom:4px;
  }
  .d-filters{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .d-filters .lbl{color:#666;font-size:13px;font-weight:500;margin-right:2px;}
  .d-select{
    background:#fff;border:1px solid #dfdfdf;border-radius:10px;
    padding:6px 14px;font-size:13px;color:#444;font-weight:500;
    display:flex;align-items:center;gap:8px;min-width:105px;justify-content:space-between;
    cursor:pointer;
  }
  .d-select:hover{border-color:#b7b7b7;background:#fcfcfc;}
  .d-select svg{transition:transform .2s ease;width:14px;height:14px;}
  .d-select:hover svg{transform:translateY(1px);}
  .d-table-head{display:flex;padding:0 20px;margin-bottom:8px;align-items:center;}
  .d-table-head span{color:#8c8c8c;font-size:13px;font-weight:500;}
  .d-col-id{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-store{width:34%;flex:1 1 34%;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:12px;}
  .d-col-type{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-size{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-status{width:18%;flex:0 0 18%;min-width:0;text-align:left;}

  #orderRows{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    padding-right:4px;padding-top:1px;padding-bottom:16px;
    scroll-behavior:smooth;
  }
  #orderRows::-webkit-scrollbar{width:5px;}
  #orderRows::-webkit-scrollbar-track{background:transparent;}
  #orderRows::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  #orderRows::-webkit-scrollbar-thumb:hover{background:#a8a8a8;}

  .d-row{
    display:flex;align-items:center;background:#fff;border:1px solid #e2e2e2;
    border-radius:14px;padding:11px 20px;margin-bottom:8px;cursor:pointer;
    animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .d-row:hover{background:#f8f9fa;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04);}
  .d-row:active{transform:translateY(0) scale(.995);box-shadow:none;}
  .d-row .d-col-id{font-size:14px;font-weight:700;color:#111;}
  .d-row .d-col-store{font-size:14px;font-weight:500;color:#111;}
  .d-row .d-col-size{color:#666;font-size:13px;font-weight:400;}
  .d-row .d-col-status{color:#666;font-size:13px;font-weight:500;text-align:left;}

  .d-summary{
    width:250px;flex:0 0 250px;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:22px 22px;
    height:100%;overflow-y:auto;
    display:flex;flex-direction:column;
    box-sizing:border-box;
  }
  .d-summary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .d-summary-head h3{font-size:17px;font-weight:600;margin:0;color:#000;}
  .d-summary .stat-block{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .d-summary .big{font-size:52px;font-weight:600;margin:0;line-height:1;color:#000;}
  .d-summary .biglabel{color:#666;font-size:12px;font-weight:500;line-height:1.35;}
  .d-summary .stat{display:flex;justify-content:space-between;font-size:13px;margin-top:14px;}
  .d-summary .stat span:first-child{color:#777;font-weight:400;}
  .d-summary .stat span:last-child{color:#000;font-weight:600;}
  .empty-state{color:var(--muted);font-size:16px;padding:60px 24px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);}

  /* order detail desktop */
  .d-detail-body{
    flex:1 1 auto;min-height:0;
    display:flex;gap:18px;width:100%;padding:6px 24px 20px;align-items:stretch;
    box-sizing:border-box;overflow:hidden;
  }
  .d-detail-side{
    width:54px;flex:0 0 54px;background:#fff;border:1px solid var(--border);border-radius:22px;
    display:flex;flex-direction:column;align-items:center;padding:16px 0;height:100%;
    box-sizing:border-box;
  }
  .d-detail-side .back-btn{
    width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;color:#111;border-radius:50%;padding:0;
    transition:transform .18s ease, color .18s ease, background-color .18s ease;
  }
  .d-detail-side .back-btn:hover{
    background:rgba(0,0,0,0.06);transform:translateX(-2px);color:#000;
  }
  .d-detail-main{
    flex:1;min-width:0;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:22px 26px 20px;
    height:100%;display:flex;flex-direction:column;
    box-sizing:border-box;overflow:hidden;
  }
  .d-detail-main .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 2px;}
  .d-detail-main .head .oid{font-size:17px;font-weight:700;color:#000;}
  .d-detail-main .head .status{color:#666;font-size:13px;font-weight:500;}
  .d-items-list{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:2px;
  }
  .d-items-list::-webkit-scrollbar{width:5px;}
  .d-items-list::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  .d-item-head{display:flex;color:#8c8c8c;font-size:13px;font-weight:500;padding:0 20px;margin-bottom:8px;align-items:center;}
  .d-item-row{
    display:flex;align-items:center;background:#fff;border:1px solid #e2e2e2;border-radius:14px;
    padding:11px 20px;margin-bottom:8px;animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
    transition:background-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .d-item-row:hover{background:#f8f9fa;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04);}
  .d-item-row .ic-id{width:22%;flex:0 0 22%;min-width:0;font-size:14px;font-weight:700;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .d-item-row .ic-name{width:38%;flex:1 1 38%;min-width:0;font-size:14px;font-weight:500;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
  .d-item-row .ic-type{width:20%;flex:0 0 20%;min-width:0;}
  .d-item-row .ic-count{width:20%;flex:0 0 20%;min-width:0;text-align:right;color:#222;font-size:14px;font-weight:600;}
  .d-detail-actions{
    flex:0 0 auto;padding-top:16px;display:flex;justify-content:center;width:100%;
  }
  .d-assign-btn{
    width:100%;background:#000;color:#fff;border:none;border-radius:999px;
    padding:13px 24px;font-size:15px;font-weight:600;display:flex;
    align-items:center;justify-content:center;gap:10px;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.12);
    transition:background-color .2s ease, transform .16s ease, box-shadow .2s ease;
  }
  .d-assign-btn:hover{background:#222;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,0.18);}
  .d-assign-btn:active{transform:translateY(0) scale(.995);}
  .d-assign-btn.assigned{background:#15803d;color:#fff;}
  .d-panel{
    width:280px;flex:0 0 280px;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:22px 24px;
    height:100%;overflow-y:auto;
    box-sizing:border-box;
    transition:width .25s ease, padding .25s ease, opacity .2s ease, flex-basis .25s ease;
  }

    display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;
  }
  .load-title{
    font-size:17.5px;font-weight:700;color:#111;margin:0 0 20px;letter-spacing:-.2px;
  }
  .loads-list{
    flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;
  }
  .loads-list::-webkit-scrollbar{width:5px;}
  .loads-list::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  .load-row-card{
    display:flex;align-items:center;background:#fff;border:1px solid #e5e5ea;
    border-radius:18px;padding:16px 28px;box-sizing:border-box;
    transition:background-color .18s ease, border-color .18s ease, transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease;
    animation:rowIn .32s cubic-bezier(.22,.85,.32,1) both;
  }
  .load-row-card:hover{
    background:#fafafa;border-color:#c7c7cc;transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,0.045);
  }
  .load-col-id{width:16%;flex:0 0 16%;font-size:14.5px;font-weight:700;color:#111;}
  .load-col-assignee{width:26%;flex:0 0 26%;font-size:14px;font-weight:500;color:#222;}
  .load-col-type{width:18%;flex:0 0 18%;display:flex;align-items:center;}
  .load-pill-temp{
    display:inline-flex;align-items:center;justify-content:center;
    padding:4px 18px;border-radius:16px;font-size:12px;font-weight:600;
  }
  .load-pill-temp.ambient{
    background:#d6eed9;color:#15803d;
  }
  .load-pill-temp.chilled{
    background:#def0fa;color:#0284c7;
  }
  .load-col-orders{width:16%;flex:0 0 16%;font-size:13.5px;font-weight:500;color:#555;}
  .load-col-status{flex:1;font-size:13.5px;font-weight:500;color:#777;}
  .load-col-action{width:125px;flex:0 0 125px;text-align:right;display:flex;justify-content:flex-end;align-items:center;}
  .load-dispatch-btn{
    background:#000;color:#fff;font-size:12.5px;font-weight:600;
    border:none;border-radius:22px;padding:8px 22px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:background-color .18s, transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
  }
  .load-dispatch-btn:hover{background:#222;transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.22);}
  .load-dispatch-btn:active{transform:translateY(1px) scale(.96)!important;}
  .load-dispatch-btn.dispatched{background:#166534;cursor:default;box-shadow:none;}
  .load-dispatch-arrow{display:inline-flex;align-items:center;}
  .load-dispatch-arrow svg{width:13px;height:13px;stroke-width:2.2;}

  /* ============ TABLET-STYLE (Loader) ============ */
  .device-tablet{
    display:none;max-width:834px;margin:0 auto;background:#fff;
    min-height:calc(100vh - 34px);
    border-left:1px solid var(--border);border-right:1px solid var(--border);
    box-sizing:border-box;
  }
  .device-tablet.active{display:flex;flex-direction:column;}
  .t-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px 14px;background:#fff;border-bottom:1px solid #f0f0f2;
    flex-shrink:0;
  }
  .t-topbar .brand{font-size:19px;letter-spacing:.2px;}
  .t-topbar .actions{display:flex;gap:14px;align-items:center;}
  .t-topbar .actions .icon-btn{width:32px;height:32px;}
  .t-title{text-align:center;color:var(--muted);font-size:22px;font-weight:500;margin:18px 0 22px;}
  .t-list{padding:0 36px 30px;flex:1 1 auto;overflow-y:auto;}
  .t-row{
    display:flex;align-items:center;gap:8px;
    background:#f7f7f8;border:1px solid #e8e8ec;border-radius:18px;
    padding:15px 18px;margin-bottom:12px;cursor:pointer;animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .t-row:hover{background:#f0f0f2;transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.05);}
  .t-row:active{transform:translateY(0) scale(.995);box-shadow:none;}
  .t-row .lr-id{font-size:13px;font-weight:700;color:#111;width:14%;flex:0 0 14%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-row .lr-store{font-size:13px;font-weight:500;color:#222;width:24%;flex:0 0 24%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;}
  .t-row .lr-win{font-size:13px;font-weight:500;color:#333;width:18%;flex:0 0 18%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-row .lr-type{width:14%;flex:0 0 14%;display:flex;align-items:center;}
  .t-row .lr-size{font-size:13px;font-weight:500;color:#333;width:14%;flex:0 0 14%;text-align:left;}
  .t-row .lr-loading{width:12%;flex:0 0 12%;display:flex;align-items:center;justify-content:flex-end;}
  .t-head-row{
    display:flex;align-items:center;padding:0 20px;margin-bottom:10px;
    color:#8e8e93;font-size:12.5px;font-weight:500;
  }
  .t-head-row .lh-id{width:14%;flex:0 0 14%;}
  .t-head-row .lh-store{width:24%;flex:0 0 24%;}
  .t-head-row .lh-win{width:18%;flex:0 0 18%;}
  .t-head-row .lh-type{width:14%;flex:0 0 14%;}
  .t-head-row .lh-size{width:14%;flex:0 0 14%;}
  .t-head-row .lh-loading{width:12%;flex:0 0 12%;text-align:right;}

  /* iOS-style toggle switch */
  .load-toggle{
    position:relative;width:44px;height:26px;border-radius:13px;border:none;
    background:#d1d1d6;cursor:pointer;flex-shrink:0;padding:0;
    transition:background-color .22s ease;
  }
  .load-toggle::after{
    content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;
    border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);
    transition:transform .22s cubic-bezier(.34,1.3,.4,1);
  }
  .load-toggle.on{background:#1c1c1e;}
  .load-toggle.on::after{transform:translateX(18px);}
  .load-toggle:active::after{transform:scale(.92);}
  .load-toggle.on:active::after{transform:translateX(18px) scale(.92);}

  /* Loader Subheader (Back arrow + Title/Toggle) */
  .loader-subbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 34px 16px;flex-shrink:0;
  }
  .loader-subbar-left{
    display:flex;align-items:center;gap:12px;
  }
  .loader-back-btn{
    width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
    background:none;border:none;border-radius:50%;cursor:pointer;color:#111;padding:0;
    transition:background-color .18s, transform .16s;
  }
  .loader-back-btn:hover{background:rgba(0,0,0,0.06);transform:translateX(-2px);}
  .loader-back-btn:active{transform:scale(.88);}
  .loader-order-title{
    font-size:16.5px;font-weight:700;color:#111;letter-spacing:-.1px;
  }
  .loader-time-info{
    font-size:12.5px;color:#777;
  }
  .loader-time-info .time-bold{
    font-weight:700;color:#111;margin-right:2px;
  }

  /* Load toggle dropdown */
  .loader-load-toggle{
    background:none;border:none;font-size:16.5px;font-weight:700;color:#111;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:8px;
    transition:background-color .18s;
  }
  .loader-load-toggle:hover{background:rgba(0,0,0,0.04);}
  .loader-load-toggle .loader-chevron{
    display:inline-flex;align-items:center;transition:transform .2s ease;
  }
  .loader-load-toggle .loader-chevron.collapsed{
    transform:rotate(-90deg);
  }

  /* Screen 1: Load Details Expanded Summary */
  .loader-summary-card{
    display:flex;justify-content:space-between;padding:0 34px;margin-bottom:20px;gap:36px;
    flex-shrink:0;
  }
  .loader-summary-col{
    flex:1;display:flex;flex-direction:column;
  }
  .loader-stat-group{
    margin-bottom:14px;
  }
  .loader-stat-lbl{
    font-size:12px;color:#777;font-weight:500;display:block;margin-bottom:3px;
  }
  .loader-stat-val{
    font-size:14.5px;font-weight:600;color:#111;
  }
  .loader-stat-val .loader-bold-time{
    font-weight:700;color:#111;margin-right:4px;
  }
  .loader-stat-val .loader-rem-time{
    font-size:12px;font-weight:400;color:#777;
  }
  .loader-order-pills{
    display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;
  }
  .loader-oid-pill{
    background:#d4f0e8;color:#0d6b4c;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:12px;
  }
  .loader-bold-veh{
    font-size:14px;font-weight:700;color:#111;letter-spacing:.2px;
  }

  /* Table head */
  .loader-table-head{
    display:flex;align-items:center;padding:0 56px 0 56px;margin-bottom:8px;color:#8e8e93;
    font-size:12.5px;font-weight:500;flex-shrink:0;
  }
  .lth-num{width:46px;flex:0 0 46px;}
  .lth-id{width:115px;flex:0 0 115px;}
  .lth-window{flex:1;min-width:0;}
  .lth-type{width:100px;flex:0 0 100px;text-align:center;}
  .lth-size{width:90px;flex:0 0 90px;text-align:right;}

  /* Batch order list */
  .loader-batch-list{
    padding:0 34px;display:flex;flex-direction:column;gap:10px;
    flex:1 1 auto;overflow-y:auto;
  }
  .loader-batch-list::-webkit-scrollbar{width:5px;}
  .loader-batch-list::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  .loader-order-card{
    display:flex;align-items:center;background:#fff;border:1px solid #e5e5ea;
    border-radius:18px;padding:14px 22px;cursor:pointer;
    transition:background-color .18s ease, border-color .18s ease, transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease;
    animation:rowIn .32s cubic-bezier(.22,.85,.32,1) both;
  }
  .loader-order-card:hover{
    background:#fafafa;border-color:#c7c7cc;transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,0.045);
  }
  .loader-order-card:active{transform:scale(.992) translateY(1px);}
  .loc-num{width:46px;flex:0 0 46px;font-size:13.5px;font-weight:500;color:#555;}
  .loc-id{width:115px;flex:0 0 115px;font-size:14px;font-weight:700;color:#111;}
  .loc-name{flex:1;min-width:0;font-size:14px;font-weight:500;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .loc-type{width:100px;flex:0 0 100px;display:flex;justify-content:center;}
  .loc-size{width:90px;flex:0 0 90px;font-size:13px;font-weight:500;color:#555;text-align:right;}
  .loc-radio{margin-left:18px;flex:0 0 22px;}

  /* Tactile Radio for Loader */
  .loader-radio{
    width:22px;height:22px;border-radius:50%;border:2px solid #d1d1d6;
    background:#fff;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .18s cubic-bezier(.34,1.4,.4,1);
    box-sizing:border-box;flex-shrink:0;position:relative;
  }
  .loader-radio:hover{border-color:#888;transform:scale(1.08);}
  .loader-radio:active{transform:scale(.9);}
  .loader-radio.checked{
    border-color:#444;background:#fff;
    animation:radioBounce 0.36s cubic-bezier(.34,1.5,.64,1);
  }
  .loader-radio.checked::after{
    content:'';width:10px;height:10px;border-radius:50%;background:#444;
    display:block;animation:innerDotPop 0.28s cubic-bezier(.34,1.5,.64,1);
  }

  /* Bottom actions */
  .loader-actions-box{
    padding:20px 34px 28px;display:flex;flex-direction:column;gap:10px;
    flex-shrink:0;margin-top:auto;
  }
  .loader-btn-start{
    background:#000;color:#fff;font-size:14px;font-weight:600;padding:13px 20px;
    border-radius:24px;border:none;cursor:pointer;width:100%;text-align:center;
    transition:background-color .18s, transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
  }
  .loader-btn-start:hover{background:#222;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.18);}
  .loader-btn-start:active{transform:translateY(1px) scale(.98)!important;}
  .loader-btn-finish{
    background:#d5d5d8;color:#888;font-size:14px;font-weight:600;padding:13px 20px;
    border-radius:24px;border:none;width:100%;text-align:center;cursor:not-allowed;
    transition:all .18s ease;
  }
  .loader-btn-finish.active{
    background:#166534;color:#fff;cursor:pointer;
  }
  .loader-btn-finish.active:hover{
    background:#14532d;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }

  /* Screen 3: Checklist - Items List */
  .loader-items-list{
    padding:0 34px 14px;display:flex;flex-direction:column;gap:10px;
    flex:1 1 auto;overflow-y:auto;
  }
  .loader-items-list::-webkit-scrollbar{width:5px;}
  .loader-items-list::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  .loader-item-card{
    display:flex;align-items:center;background:#fff;border:1px solid #e5e5ea;
    border-radius:18px;padding:14px 20px;cursor:pointer;
    transition:background-color .18s ease, border-color .18s ease, transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease;
    animation:rowIn .32s cubic-bezier(.22,.85,.32,1) both;
  }
  .loader-item-card:hover{
    background:#fafafa;border-color:#c7c7cc;
  }
  .loader-item-card.selected-report{
    border-color:#c0c0c6;background:#fafbfc;
    box-shadow:0 4px 14px rgba(0,0,0,0.04);
  }
  .lic-id{width:110px;flex:0 0 110px;font-size:14px;font-weight:700;color:#111;}
  .lic-name{flex:1;min-width:0;font-size:14px;font-weight:500;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lic-type{width:95px;flex:0 0 95px;display:flex;justify-content:center;}
  .lic-qty{width:56px;flex:0 0 56px;font-size:14px;font-weight:600;color:#222;text-align:center;}
  .lic-checkbox{
    width:24px;height:24px;border:1.5px solid #d1d1d6;border-radius:7px;
    background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    margin-left:12px;flex:0 0 24px;transition:all .18s cubic-bezier(.34,1.3,.4,1);
    box-sizing:border-box;
  }
  .lic-checkbox:hover{border-color:#999;transform:scale(1.06);}
  .lic-checkbox:active{transform:scale(.9);}
  .lic-checkbox.checked{
    background:#9a9a9e;border-color:#9a9a9e;
    animation:popIn .25s cubic-bezier(.34,1.4,.4,1);
  }
  .lic-checkbox.checked::after{
    content:'';width:10px;height:10px;border-radius:2px;background:transparent;display:block;
  }

  /* Checklist bottom bar */
  .loader-checklist-bottom{
    padding:16px 34px 28px;display:flex;flex-direction:column;gap:14px;
    flex-shrink:0;margin-top:auto;position:relative;
  }
  .loader-mark-loaded-btn{
    background:#111;color:#fff;font-size:15px;font-weight:600;padding:14px 20px;
    border-radius:28px;border:none;cursor:pointer;width:100%;text-align:center;
    transition:background-color .18s, transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
    animation:rowIn .3s cubic-bezier(.22,.85,.32,1) both;
  }
  .loader-mark-loaded-btn:hover{background:#222;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.18);}
  .loader-mark-loaded-btn:active{transform:translateY(1px) scale(.98)!important;}
  .loader-report-float-wrap{
    display:flex;justify-content:flex-end;
  }
  .loader-report-pill-btn{
    display:inline-flex;align-items:center;gap:8px;background:#fff;
    border:1px solid #d4d4d4;border-radius:22px;padding:8px 18px;
    font-size:13px;font-weight:600;color:#222;cursor:pointer;
    transition:all .18s ease;box-shadow:0 1px 4px rgba(0,0,0,0.04);
  }
  .loader-report-pill-btn:hover{
    background:#f7f7f8;border-color:#999;transform:translateY(-1px);
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
  }
  .loader-report-pill-btn:active{transform:scale(.96);}
  .loader-report-pill-btn.expanded{
    background:#111;border-color:#111;color:#fff;
  }
  .loader-report-pill-btn.expanded .report-badge-dot{
    background:#fff;color:#111;
  }
  .loader-report-pill-btn .report-badge-dot{
    width:16px;height:16px;border-radius:50%;background:#111;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;font-family:sans-serif;line-height:1;
  }

  /* Report sheet (expandable) */
  .loader-report-sheet{
    margin:0 34px 12px;background:#eeeff1;border:1px solid #e0e1e5;
    border-radius:20px;padding:18px 22px;box-sizing:border-box;
    flex-shrink:0;animation:rowIn .3s cubic-bezier(.22,.85,.32,1) both;
  }
  .loader-report-sheet.hidden{display:none!important;}
  .loader-report-head{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .loader-report-badge{
    width:18px;height:18px;border-radius:50%;background:#111;color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;line-height:1;font-family:sans-serif;
  }
  .loader-report-title{
    font-size:14px;font-weight:700;color:#111;
  }
  .loader-report-lbl{
    font-size:12px;font-weight:600;color:#444;margin-bottom:6px;display:block;
  }
  .loader-report-textarea{
    width:100%;min-height:68px;background:#fff;border:1px solid #dfdfdf;
    border-radius:12px;padding:10px 14px;font-family:inherit;font-size:13px;

  .loader-report-action-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .loader-report-action-left{
    display:flex;align-items:center;gap:10px;
  }
  .loader-report-action-lbl{
    font-size:12.5px;font-weight:500;color:#444;
  }
  .loader-report-select{

    font-size:12.5px;font-weight:500;color:#222;outline:none;cursor:pointer;
  }
  .loader-report-save-btn{
    background:#111;color:#fff;border:none;border-radius:20px;
    padding:8px 26px;font-size:13px;font-weight:600;cursor:pointer;
    transition:background-color .18s, transform .16s;
  }
  .loader-report-save-btn:hover{background:#222;transform:translateY(-1px);}
  .loader-report-save-btn:active{transform:scale(.96);}

  /* ============ PHONE-STYLE (Driver) ============ */
  .device-phone{
    display:none;max-width:393px;margin:0 auto;background:#fff;min-height:calc(100vh - 34px);
    border-left:1px solid var(--border);border-right:1px solid var(--border);
  }
  .device-phone.active{display:block;}
  .p-topbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:26px 20px 10px;position:relative;}
  .p-topbar .brand{font-size:16px;}
  .p-back{position:absolute;left:16px;top:22px;}
  .p-sub{display:flex;justify-content:space-between;padding:0 24px;color:var(--muted);font-size:14px;font-weight:500;margin:12px 0 14px;}
  .stop-card{
    background:rgba(216,215,215,0.2);border:1px solid var(--border);border-radius:18px;
    margin:0 24px 20px;padding:20px;cursor:pointer;animation:rowIn .38s cubic-bezier(.22,.85,.32,1) both;
  }
  .stop-card.next{background:#f1f1f1;}

  .stop-card:active{transform:translateY(0) scale(.99);box-shadow:none;}
  .stop-card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .stop-card .row1 .store{font-size:16px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stop-card .row1 svg{flex:0 0 auto;transition:transform .18s ease;}
  .stop-card:hover .row1 svg{transform:translateX(3px);}

  .stop-card .kv .k{color:var(--muted);font-weight:500;}
  .stop-card .kv .v{font-weight:500;}
  .stop-card .divider{margin:10px 0;}
  .stop-card .kv.remaining{margin-top:14px;}
  .next-label{color:var(--muted);font-size:14px;font-weight:500;padding:0 24px;margin-bottom:14px;}

  .map-box{
    margin:0 20px 18px;height:280px;border-radius:22px;border:1px solid #dfdfdf;overflow:hidden;position:relative;
    background:
      linear-gradient(#eef1f4,#eef1f4) ,
      repeating-linear-gradient(0deg, rgba(180,190,200,.5) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(180,190,200,.5) 0 1px, transparent 1px 34px);

  .map-box .pin{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);

function showToast(msg){
  let t = document.getElementById('wpToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'wpToast';
    t.className = 'wp-toast';
    document.body.appendChild(t);
  }
  t.innerHTML = `${ICON.check} <span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2500);
}

function attachDispatchOrder(){
  const backBtn = document.getElementById('backToList');
  if (backBtn) {
    backBtn.addEventListener('click', ()=> nav({name:'dispatch-list', nav:'live'}));
  }
  const togglePanelBtn = document.getElementById('toggleDetailPanel');
  const panel = document.getElementById('orderDetailPanel');
  if (togglePanelBtn && panel) {
    togglePanelBtn.addEventListener('click', ()=>{
      panel.classList.toggle('collapsed');
    });
  }
  const assignBtn = document.getElementById('assignOrderBtn');
  if (assignBtn) {
    assignBtn.addEventListener('click', ()=>{
      const uid = assignBtn.dataset.uid;
      const o = dispatchOrders.find(x=>x.uid===uid);
      if (!o) return;
      if (o.status !== 'Assigned') {
        o.status = 'Assigned';
        assignBtn.classList.add('assigned');
        const btnText = document.getElementById('assignBtnText');
        if (btnText) btnText.textContent = 'Order Assigned';
        const st = document.getElementById('detailOrderStatus');
        if (st) st.textContent = 'Assigned';
        showToast(`Order ${o.id} successfully assigned!`);
      } else {
        o.status = 'Unassigned';
        assignBtn.classList.remove('assigned');
        const btnText = document.getElementById('assignBtnText');
        if (btnText) btnText.textContent = 'Assign Order';
        const st = document.getElementById('detailOrderStatus');
        if (st) st.textContent = 'Unassigned';
        showToast(`Order ${o.id} reverted to Unassigned`);
      }
    });
  }
}

function attachDispatchStaging(clusterId){

  if(backBtn){
    backBtn.addEventListener('click', ()=> nav({name:'dispatch-clustering', role:'dispatch'}));
  }

  function updateStagingUI(){
    const cards = document.querySelectorAll('.staging-order-card');
    cards.forEach(card => {
      const idx = parseInt(card.dataset.idx, 10);
      const isSel = !!stagingOrdersData[idx].selected;
      card.classList.toggle('selected', isSel);
      const circle = card.querySelector('.staging-check-circle');
      if(circle) circle.classList.toggle('checked', isSel);
    });

    const selectedCount = stagingOrdersData.filter(o => o.selected).length;
    const allSelected = selectedCount === stagingOrdersData.length;
    const countEl = document.getElementById('stagingSelectedCount');
    if(countEl){
      countEl.textContent = `${selectedCount} Selected`;
      countEl.classList.remove('count-bump');
      void countEl.offsetWidth;
      countEl.classList.add('count-bump');
    }
    const selectAllCircle = document.getElementById('stagingSelectAllCircle');
    if(selectAllCircle) selectAllCircle.classList.toggle('checked', allSelected);
  }

  document.querySelectorAll('.staging-order-card').forEach(card => {
    card.addEventListener('click', ()=>{
      const idx = parseInt(card.dataset.idx, 10);
      stagingOrdersData[idx].selected = !stagingOrdersData[idx].selected;
      updateStagingUI();
    });
  });

  const selectAll = document.getElementById('stagingSelectAll');
  if(selectAll){
    selectAll.addEventListener('click', (e)=>{
      e.preventDefault();
      const allSelected = stagingOrdersData.every(o => o.selected);
      stagingOrdersData.forEach(o => o.selected = !allSelected);
      updateStagingUI();
    });
  }

  const defferBtn = document.getElementById('stagingDefferBtn');
  if(defferBtn){
    defferBtn.addEventListener('click', ()=>{
      const selCount = stagingOrdersData.filter(o => o.selected).length;
      if(selCount === 0){

      }
    });
  }

  const stageBtn = document.getElementById('stagingStageBtn');
  if(stageBtn){
    stageBtn.addEventListener('click', ()=>{
      const selCount = stagingOrdersData.filter(o => o.selected).length;
      if(selCount === 0){
        showToast('Please select at least one order to stage.');

        showToast(`${selCount} order(s) staged successfully!`);
        setTimeout(()=> nav({name:'dispatch-trip-assigning', clusterId: clusterId || 'CLS-BF785', role:'dispatch'}), 300);
      }
    });
  }

  const rail = document.getElementById('stagingAssignRail');
  if(rail){
    rail.addEventListener('click', ()=>{
      nav({name:'dispatch-trip-assigning', clusterId: clusterId || 'CLS-BF785', role:'dispatch'});
    });
  }
}

/* ---------------------------------------------------------------
   TACTILE CLICK & RIPPLE ANIMATION ENGINE
--------------------------------------------------------------- */
function createRipple(e, el){
  if(!el || el.disabled) return;
  const rect = el.getBoundingClientRect();
  const diameter = Math.max(rect.width, rect.height) * 1.5;
  const ripple = document.createElement('span');
  ripple.className = 'wp-ripple';
  ripple.style.width = ripple.style.height = `${diameter}px`;
  ripple.style.left = `${e.clientX - rect.left}px`;
  ripple.style.top = `${e.clientY - rect.top}px`;

  // Determine ripple color tone
  const bg = window.getComputedStyle(el).backgroundColor;
  const isDark = bg === 'rgb(0, 0, 0)' || bg === 'rgb(17, 17, 17)' || bg === 'rgb(34, 34, 34)' ||
    el.classList.contains('staging-btn-stage') || el.classList.contains('trip-continue-btn') ||
    el.classList.contains('trip-confirm-btn') || el.classList.contains('signin-btn') ||
    el.classList.contains('sm-signin-btn');

  if(isDark){
    ripple.style.background = 'radial-gradient(circle, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.12) 60%, transparent 100%)';
  } else if(el.classList.contains('trip-order-chip')){
    ripple.style.background = 'radial-gradient(circle, rgba(109,40,217,0.3) 0%, rgba(109,40,217,0.08) 60%, transparent 100%)';
  } else {
    ripple.style.background = 'radial-gradient(circle, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.05) 60%, transparent 100%)';
  }

  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 550);
}

    loaderState.collapsed = isCol;
    route = {name:'loader-load', loadId: urlParams.get('loadId') || 'load1', role:'loader', collapsed: isCol};
  } else if(routeParam === 'loader-checklist'){
    route = {name:'loader-checklist', loadId: urlParams.get('loadId') || 'load1', orderId: urlParams.get('orderId') || 'FRS-2HG3', role:'loader'};
  } else if(routeParam === 'store-dashboard'){
    route = {name:'store-dashboard', role:'store-manager'};
  } else if(routeParam === 'store-order-detail'){
    route = {name:'store-order-detail', orderId: urlParams.get('orderId') || 'FRS-2HG3', role:'store-manager'};
  } else if(routeParam){
    route = {name: routeParam, role: urlParams.get('role') || 'dispatch', clusterId: urlParams.get('clusterId') || 'CLS-BF785', loadId: urlParams.get('loadId') || 'LDS-2HG3', orderId: urlParams.get('orderId') || 'FRS-2HG3'};
  }
} catch(e){}
render();
</script>
