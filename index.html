<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Waypoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f1f1;
    --card:#f4f4f4;
    --border:#d4d4d4;
    --muted:#7a7a7a;
    --muted-58:rgba(122,122,122,0.58);
    --black:#000;
    --white:#fff;
    --chilled:rgba(172,234,238,0.55);
    --fresh:rgba(172,234,238,0.55);
    --ambient:rgba(172,238,176,0.55);
    --radius-lg:20px;
    --radius-md:10px;
    --sidebar-w:334px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Roboto','Google Sans Flex','Google Sans',-apple-system,'Segoe UI',Arial,sans-serif;
    background:var(--bg);
    color:#000;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    animation:bodyFade .4s ease;
  }
  @keyframes bodyFade{from{opacity:0;}to{opacity:1;}}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  .hidden{display:none!important;}

  /* ---------- Motion system ---------- */
  @keyframes screenIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes popIn{
    0%{transform:scale(.55); opacity:0;}
    65%{transform:scale(1.18);}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes rowIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  #app > *{animation:screenIn .38s cubic-bezier(.22,.85,.32,1) both;}
  button,.icon-btn,.back-btn,.d-select,.pill,.check-box,.signin-btn,.mark-btn,
  .d-row,.t-row,.batch-row,.item-row,.p-item-row,.stop-card,.order-chip,
  .d-nav-item,.field,#roleBar button,.d-summary,.load-head,.forgot,a{
    transition:background-color .22s ease, color .22s ease, border-color .22s ease,
      transform .16s cubic-bezier(.34,1.2,.4,1), box-shadow .22s ease, opacity .22s ease;
  }
  button{cursor:pointer;}
  ::selection{background:#000;color:#fff;}

  /* ---------- Top role switcher ---------- */
  #roleBar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    background:#000;color:#fff;font-size:12px;padding:6px 14px;
    padding-top:calc(6px + env(safe-area-inset-top,0px));
    letter-spacing:.4px;box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #roleBar .rb-left{display:flex;gap:14px;align-items:center;}
  #roleBar button{
    background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;
  }
  #roleBar button:hover{border-color:#fff;transform:translateY(-1px);}
  #roleBar button:active{transform:translateY(0) scale(.93);}
  #roleBar button.active{background:#fff;color:#000;border-color:#fff;font-weight:700;}
  #roleBar button.active:hover{transform:none;}
  #roleBar .rb-logout{background:transparent;border:none;color:#fff;text-decoration:underline;cursor:pointer;font-size:11px;}
  #roleBar .rb-logout:hover{opacity:.75;}
  #roleBar .rb-logout:active{opacity:.5;}
  #app{padding-top:34px;}

  /* ---------- Shared bits ---------- */
  .wp-logo{font-weight:900;letter-spacing:.2px;}
  .wp-role{font-weight:500;color:#000;}
  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:20px;
    font-size:12px;font-weight:500;padding:3px 14px;white-space:nowrap;
  }
  .pill.Chilled{background:#cbf3f5;color:#000;}
  .pill.Fresh{background:#cbf3f5;color:#000;}
  .pill.Ambient{background:#daf5db;color:#000;}
  .pill.Fragile{background:#f0d9a8;color:#000;}
  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;color:#000;background:none;border:none;border-radius:50%;
  }
  .icon-btn:hover{background:rgba(0,0,0,0.06);transform:scale(1.1);}
  .icon-btn:active{transform:scale(.9);}
  .back-btn{
    width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:none;border:none;color:#000;font-size:22px;border-radius:50%;
  }
  .back-btn:hover{background:rgba(0,0,0,0.06);}
  .back-btn:hover svg path{transform:translateX(-1px);}
  .back-btn:active{transform:scale(.88);}

  /* ================= LOGIN SCREENS ================= */
  .login-wrap{min-height:calc(100vh - 34px);display:flex;flex-direction:column;background:#fff;}
  .login-topbar{display:flex;align-items:center;gap:10px;padding:28px 34px;font-size:20px;}
  .login-card-area{flex:1;display:flex;align-items:center;justify-content:center;}
  .login-card{width:100%;max-width:469px;padding:0 16px;text-align:left;}
  .login-card h1{font-size:40px;font-weight:500;margin:0 0 12px;text-align:center;}
  .login-card p.sub{color:var(--muted);font-size:20px;margin:0 0 40px;text-align:center;font-weight:500;}
  .field{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:10px 24px;margin-bottom:16px;
  }
  .field:hover{border-color:#b7b7b7;}
  .field label{display:block;color:var(--muted-58);font-size:16px;font-weight:500;margin-bottom:2px;}
  .field .val{font-size:16px;font-weight:500;color:#000;}
  .field .dots{font-size:22px;letter-spacing:2px;color:#000;}
  .forgot{display:block;text-align:right;color:var(--muted-58);font-size:16px;font-weight:500;margin:8px 0 24px;cursor:pointer;}
  .forgot:hover{color:#000;}
  .signin-btn{
    width:100%;background:#000;color:#f4f4f4;border:1px solid #000;border-radius:50px;
    padding:22px;font-size:20px;font-weight:500;cursor:pointer;text-align:center;
  }
  .signin-btn:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.22);}
  .signin-btn:active{transform:translateY(0) scale(.98);box-shadow:none;}
  .signup-line{text-align:center;margin-top:32px;color:var(--muted-58);font-size:18px;font-weight:500;}
  .signup-line b{color:rgba(0,0,0,.5);font-weight:700;cursor:pointer;}
  .signup-line b:hover{color:#000;}

  /* ============ DISPATCH (Desktop) ============ */
  .dispatch-shell{
    display:none;background:var(--bg);
    min-height:calc(100vh - 34px);
    height:calc(100vh - 34px);
    overflow:hidden;
  }
  .dispatch-shell.active{display:flex;flex-direction:column;}
  .d-topbar{
    height:56px;flex:0 0 56px;background:var(--bg);z-index:10;
    display:flex;align-items:center;justify-content:space-between;padding:0 28px;
    box-sizing:border-box;
  }
  .d-topbar .brand{font-size:17px;letter-spacing:.2px;}
  .d-topbar .brand .wp-logo{font-weight:900;}
  .d-topbar .brand .wp-role{font-weight:500;}
  .d-topbar .actions{display:flex;gap:14px;align-items:center;}
  .d-topbar .actions .icon-btn{width:28px;height:28px;}
  .d-body{
    flex:1 1 auto;
    min-height:0;
    display:flex;gap:18px;width:100%;
    padding:6px 24px 20px;
    box-sizing:border-box;
    align-items:stretch;
    overflow:hidden;
  }
  .d-sidebar{
    width:240px;flex:0 0 240px;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:20px 22px;
    height:100%;overflow-y:auto;
    display:flex;flex-direction:column;
    box-sizing:border-box;
  }
  .panel-toggle-btn{
    width:24px;height:24px;margin-bottom:18px;margin-left:-2px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;color:#555;
  }
  .panel-toggle-btn:hover{color:#000;transform:scale(1.05);}
  .d-sidebar .group-label{
    color:#888;font-size:11px;font-weight:600;padding:0;margin:16px 0 8px;letter-spacing:.5px;
  }
  .d-sidebar .group-label:first-of-type{margin-top:0;}
  .d-nav-item{
    display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;
    font-size:14px;font-weight:500;color:#555;
    border:none;background:transparent;border-radius:6px;
    transition:color .18s ease, transform .16s ease;
  }
  .d-nav-item svg{flex:0 0 18px;color:#666;transition:color .18s ease;}
  .d-nav-item.active{font-weight:700;color:#000;}
  .d-nav-item.active svg{color:#000;}
  .d-nav-item:hover{color:#000;transform:translateX(2px);}
  .d-nav-item:hover svg{color:#000;}
  .d-nav-item:active{transform:scale(.98);}
  
  .d-main{
    flex:1;min-width:0;
    height:100%;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .d-header-locked{
    flex:0 0 auto;
    background:var(--bg);
    position:sticky;top:0;z-index:4;
    padding-bottom:4px;
  }
  .d-filters{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .d-filters .lbl{color:#666;font-size:13px;font-weight:500;margin-right:2px;}
  .d-select{
    background:#fff;border:1px solid #dfdfdf;border-radius:10px;
    padding:6px 14px;font-size:13px;color:#444;font-weight:500;
    display:flex;align-items:center;gap:8px;min-width:105px;justify-content:space-between;
    cursor:pointer;
  }
  .d-select:hover{border-color:#b7b7b7;background:#fcfcfc;}
  .d-select svg{transition:transform .2s ease;width:14px;height:14px;}
  .d-select:hover svg{transform:translateY(1px);}
  .d-table-head{display:flex;padding:0 20px;margin-bottom:8px;align-items:center;}
  .d-table-head span{color:#8c8c8c;font-size:13px;font-weight:500;}
  .d-col-id{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-store{width:34%;flex:1 1 34%;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:12px;}
  .d-col-type{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-size{width:16%;flex:0 0 16%;min-width:0;}
  .d-col-status{width:18%;flex:0 0 18%;min-width:0;text-align:left;}

  #orderRows{
    flex:1 1 auto;min-height:0;overflow-y:auto;
    padding-right:4px;padding-top:1px;padding-bottom:16px;
    scroll-behavior:smooth;
  }
  #orderRows::-webkit-scrollbar{width:5px;}
  #orderRows::-webkit-scrollbar-track{background:transparent;}
  #orderRows::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  #orderRows::-webkit-scrollbar-thumb:hover{background:#a8a8a8;}

  .d-row{
    display:flex;align-items:center;background:#fff;border:1px solid #e2e2e2;
    border-radius:14px;padding:11px 20px;margin-bottom:8px;cursor:pointer;
    animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .d-row:hover{background:#f8f9fa;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04);}
  .d-row:active{transform:translateY(0) scale(.995);box-shadow:none;}
  .d-row .d-col-id{font-size:14px;font-weight:700;color:#111;}
  .d-row .d-col-store{font-size:14px;font-weight:500;color:#111;}
  .d-row .d-col-size{color:#666;font-size:13px;font-weight:400;}
  .d-row .d-col-status{color:#666;font-size:13px;font-weight:500;text-align:left;}

  .d-summary{
    width:250px;flex:0 0 250px;background:#fff;border:1px solid var(--border);
    border-radius:22px;padding:22px 22px;
    height:100%;overflow-y:auto;
    display:flex;flex-direction:column;
    box-sizing:border-box;
  }
  .d-summary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .d-summary-head h3{font-size:17px;font-weight:600;margin:0;color:#000;}
  .d-summary .stat-block{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .d-summary .big{font-size:52px;font-weight:600;margin:0;line-height:1;color:#000;}
  .d-summary .biglabel{color:#666;font-size:12px;font-weight:500;line-height:1.35;}
  .d-summary .stat{display:flex;justify-content:space-between;font-size:13px;margin-top:14px;}
  .d-summary .stat span:first-child{color:#777;font-weight:400;}
  .d-summary .stat span:last-child{color:#000;font-weight:600;}
  .empty-state{color:var(--muted);font-size:16px;padding:60px 24px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);}

  /* order detail desktop */
  .d-detail-body{
    flex:1 1 auto;min-height:0;
    display:flex;gap:18px;width:100%;padding:6px 24px 20px;align-items:stretch;
    box-sizing:border-box;overflow:hidden;
  }
  .d-detail-side{
    width:72px;flex:0 0 72px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    display:flex;justify-content:center;padding-top:12px;height:70px;
    position:sticky;top:88px;
  }
  .d-detail-main{
    flex:1;min-width:0;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:24px 30px;
    height:100%;overflow-y:auto;
  }
  .d-detail-main::-webkit-scrollbar{width:6px;}
  .d-detail-main::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:10px;}
  .d-detail-main .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .d-detail-main .head .oid{font-size:20px;font-weight:500;}
  .d-detail-main .head .status{color:var(--muted);font-size:16px;font-weight:500;}
  .d-item-head{display:flex;color:var(--muted-58);font-size:16px;font-weight:500;padding:0 24px;margin-bottom:8px;}
  .d-item-row{
    display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:16px 24px;margin-bottom:12px;animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .d-item-row:hover{box-shadow:0 6px 14px rgba(0,0,0,.05);transform:translateY(-1px);}
  .d-item-row .ic-id{width:22%;flex:0 0 22%;min-width:0;font-size:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .d-item-row .ic-name{width:38%;flex:1 1 38%;min-width:0;font-size:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
  .d-item-row .ic-type{width:20%;flex:0 0 20%;min-width:0;}
  .d-item-row .ic-count{width:20%;flex:0 0 20%;min-width:0;text-align:right;color:var(--muted);font-size:24px;font-weight:500;}
  .d-panel{
    width:340px;flex:0 0 340px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:24px;
    height:fit-content;max-height:100%;overflow-y:auto;
    position:sticky;top:88px;
  }
  .d-panel h3{font-size:20px;font-weight:500;margin:0 0 20px;}
  .d-panel .stat-block{margin-bottom:22px;}
  .d-panel .kv{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:16px;}
  .d-panel .kv .k{color:var(--muted);font-weight:500;flex:0 0 auto;}
  .d-panel .kv .v{font-weight:500;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ============ TABLET-STYLE (Loader) ============ */
  .device-tablet{
    display:none;max-width:834px;margin:0 auto;background:#fff;min-height:calc(100vh - 34px);
    border-left:1px solid var(--border);border-right:1px solid var(--border);
  }
  .device-tablet.active{display:block;}
  .t-topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 30px 6px;}
  .t-topbar .brand{font-size:20px;}
  .t-topbar .actions{display:flex;gap:20px;align-items:center;}
  .t-backrow{padding:0 24px;}
  .t-title{text-align:center;color:var(--muted);font-size:24px;font-weight:500;margin:14px 0 28px;}
  .t-list{padding:0 44px 30px;}
  .t-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px 22px;margin-bottom:16px;cursor:pointer;animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .t-row:hover{background:#eceff0;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.07);}
  .t-row:active{transform:translateY(0) scale(.995);box-shadow:none;}
  .t-row .cell{font-size:16px;font-weight:500;}
  .t-row .id{font-size:12px;font-weight:500;color:#000;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-row .store{font-size:12px;font-weight:500;flex:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;}
  .t-row .win{font-size:12px;font-weight:500;flex:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-row .size{color:var(--muted);font-size:16px;font-weight:500;flex:1;min-width:0;text-align:right;}
  .t-head-row{display:flex;padding:0 22px;margin-bottom:6px;color:var(--muted-58);font-size:16px;font-weight:500;}
  .t-head-row span{flex:1;}
  .t-head-row span:first-child{flex:1;}
  .t-head-row span:nth-child(2){flex:2;}
  .t-head-row span:nth-child(3){flex:1.3;}
  .t-head-row span:last-child{text-align:right;flex:1;}

  .load-summary{padding:0 38px;margin-top:6px;}
  .load-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:border-radius:var(--radius-md);}
  .load-head:hover{background:#f7f7f7;}
  .load-head .lid{color:var(--muted);font-size:24px;font-weight:500;}
  .load-grid{padding:0 14px 10px;}
  .load-grid .row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;}
  .load-grid .row .k{color:var(--muted);font-weight:500;}
  .load-grid .row .v{font-weight:500;}
  .order-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .order-pill{background:var(--chilled);border-radius:20px;font-size:12px;font-weight:500;padding:5px 12px;}

  .batch-list{padding:14px 30px 30px;}
  .batch-row{
    display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:22px 28px;margin-bottom:16px;cursor:pointer;
    animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .batch-row:hover{background:#eceff0;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.07);}
  .batch-row:active{transform:translateY(0) scale(.995);box-shadow:none;}
  .batch-row .num{color:rgba(0,0,0,.5);font-size:20px;font-weight:500;width:24px;flex:0 0 24px;}
  .batch-row .oid{font-size:20px;font-weight:500;width:105px;flex:0 0 105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .batch-row .name{font-size:20px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
  .batch-row .count{color:var(--muted);font-size:16px;font-weight:500;width:75px;flex:0 0 75px;text-align:right;}

  .checklist-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 30px;margin-bottom:16px;gap:12px;}
  .checklist-head .oid{color:var(--muted);font-size:24px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .checklist-head .win{font-size:16px;font-weight:500;flex:0 0 auto;white-space:nowrap;}
  .checklist-head .win small{font-size:12px;color:rgba(0,0,0,.5);}
  .item-row{
    display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:22px 28px;margin:0 30px 16px;cursor:default;
    animation:rowIn .35s cubic-bezier(.22,.85,.32,1) both;
  }
  .item-row:hover{box-shadow:0 6px 14px rgba(0,0,0,.05);}
  .item-row .iid{font-size:20px;font-weight:500;width:110px;flex:0 0 110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-row .iname{font-size:20px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
  .item-row .icount{color:var(--muted);font-size:24px;font-weight:500;width:70px;flex:0 0 70px;}
  .check-box{
    width:33px;height:31px;border:1px solid var(--border);border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#fff;flex:0 0 33px;
  }
  .check-box:hover{border-color:#999;transform:scale(1.06);}
  .check-box:active{transform:scale(.9);}
  .check-box.checked{background:#000;border-color:#000;color:#fff;font-size:16px;animation:popIn .28s cubic-bezier(.34,1.4,.4,1);}

--------------------------------------------------------------- */
let route = {name:'landing'};

function nav(r){ route = r; render(); window.scrollTo(0,0); }

function switchRole(role){
  if(role==='dispatch') nav({name:'login', role:'dispatch'});
  if(role==='loader') nav({name:'login', role:'loader'});
  if(role==='driver') nav({name:'login', role:'driver'});
}
function logout(){ nav({name:'landing'}); }

/* ---------------------------------------------------------------
   RENDER
--------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('#roleBar button[data-role]').forEach(b=>{
    b.classList.toggle('active', route.role===b.dataset.role);
  });

  if(route.name==='landing'){ app.innerHTML = landingScreen(); return; }
  if(route.name==='login'){ app.innerHTML = loginScreen(route.role); return; }
  if(route.name==='dispatch-list'){ app.innerHTML = dispatchListScreen(route.nav||'live'); attachDispatchList(); return; }
  if(route.name==='dispatch-order'){ app.innerHTML = dispatchOrderScreen(route.uid); attachDispatchOrder(); return; }
  if(route.name==='loader-list'){ app.innerHTML = loaderListScreen(); attachLoaderList(); return; }
  if(route.name==='loader-load'){ app.innerHTML = loaderLoadScreen(route.loadId); attachLoaderLoad(route.loadId); return; }
  if(route.name==='loader-checklist'){ app.innerHTML = loaderChecklistScreen(route.loadId, route.orderId); attachLoaderChecklist(route.loadId, route.orderId); return; }
  if(route.name==='driver-list'){ app.innerHTML = driverListScreen(); attachDriverList(); return; }
  if(route.name==='driver-stop'){ app.innerHTML = driverStopScreen(route.stopId); attachDriverStop(route.stopId); return; }
  if(route.name==='driver-checklist'){ app.innerHTML = driverChecklistScreen(route.stopId); attachDriverChecklist(route.stopId); return; }
}

/* ================= DRIVER: ITEM CHECKLIST ================= */
function driverChecklistScreen(stopId){
  const s = driverStops.find(x=>x.id===stopId) || driverStops[0];
  const items = driverItemsFor(s.orderId);
  const scope = 'driver-'+stopId;
  const allChecked = items.every((_,i)=>checkState[scope+'-'+i]);
  return `
  <div class="device-phone active">
    <div class="p-topbar">
      <button class="back-btn p-back" id="backToStop">${ICON.back}</button>
      <span class="wp-logo" style="font-size:16px;">WAYPOINT</span><span class="wp-role" style="font-size:16px;">&nbsp;DRIVER</span>
    </div>
    <div class="p-sub" style="margin-top:20px;"><span>Time remaining</span><span>${s.remaining}</span></div>
    <div class="p-sub" style="margin-top:0;"><span style="font-size:20px;color:#000;font-weight:500;">${s.orderId}</span><span>${s.items} items</span></div>
    <div style="margin-top:20px;">
      ${items.map((it,i)=>{
        const key = scope+'-'+i;
        const checked = !!checkState[key];
        return `
        <div class="p-item-row ${checked?'done':''}" data-key="${key}">
          <span class="iid">${it.id}</span>
          <span class="icnt">X ${it.count}</span>
          <span class="check-box ${checked?'checked':''}">${checked?ICON.check:''}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="mark-btn" id="markDelivered" ${allChecked?'':'disabled'}>Mark Delivered</button>
  </div>`;
}
function attachDriverChecklist(stopId){
  document.getElementById('backToStop').addEventListener('click', ()=> nav({name:'driver-stop', stopId}));
  document.querySelectorAll('.p-item-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const k = el.dataset.key;
      checkState[k] = !checkState[k];
      render();
    });
  });
  const btn = document.getElementById('markDelivered');
  btn.addEventListener('click', ()=>{
    if(btn.disabled) return;
    const s = driverStops.find(x=>x.id===stopId);
    if(s) s.delivered = true;
    nav({name:'driver-list'});
  });
}
